# Release Please must be allowed to open/update its release PR. Either:
# - Repo: Settings → Actions → General → Workflow permissions → Read and write,
#   and enable "Allow GitHub Actions to create and approve pull requests"
#   https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/enabling-features-for-your-repository/managing-github-actions-settings-for-your-repository#preventing-github-actions-from-creating-or-approving-pull-requests
# - Or add repo secret RELEASE_PLEASE_TOKEN (fine-grained PAT: Contents R/W, Pull requests R/W, Metadata R)

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
