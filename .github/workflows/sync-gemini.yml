# Mirrors CLAUDE.md → GEMINI.md via PR so protected branches still pass required checks.

name: Sync GEMINI.md from CLAUDE.md

on:
  push:
    branches: [main, Development]
    paths:
      - "CLAUDE.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-gemini-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror CLAUDE.md → GEMINI.md
    if: ${{ !contains(github.event.head_commit.message || '', '[gemini-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Copy CLAUDE.md to GEMINI.md
        run: cp CLAUDE.md GEMINI.md

      - name: Open PR with changes
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          base: ${{ github.ref_name }}
          branch: automated/gemini-sync/${{ github.ref_name }}
          commit-message: "chore: sync GEMINI.md from CLAUDE.md [gemini-sync]"
          title: "chore: sync GEMINI.md from CLAUDE.md"
          body: |
            Automated copy of `CLAUDE.md` for agents that read `GEMINI.md`.

            **Merge after TypeScript & Lint is green.**
