name: Publish Docker Image
on:
  push:
    branches: ['main', 'Development']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'CHANGELOG*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'

jobs:
  push_to_registry:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image tags
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "app=ghcr.io/dbwg2009/noted:latest,dbwg2009/noted:latest" >> $GITHUB_OUTPUT
            echo "migrator=ghcr.io/dbwg2009/noted-migrator:latest,dbwg2009/noted-migrator:latest" >> $GITHUB_OUTPUT
          else
            echo "app=ghcr.io/dbwg2009/noted:development" >> $GITHUB_OUTPUT
            echo "migrator=ghcr.io/dbwg2009/noted-migrator:development" >> $GITHUB_OUTPUT
          fi

      - name: Build and push App
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.app }}
          target: runner
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.migrator }}
          target: migrator
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: dbwg2009/noted
          short-description: Noted - AI-powered gift planning and birthday tracking.
          readme-filepath: ./README.md
