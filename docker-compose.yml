services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
      POSTGRES_DB: birthday
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birthday -d birthday"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://birthday:birthday@db:5432/birthday"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://birthday:birthday@db:5432/birthday"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required - generate with openssl rand -base64 32}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      RESEND_API_KEY: "${RESEND_API_KEY:?RESEND_API_KEY is required}"
      EMAIL_FROM: "${EMAIL_FROM:-Birthday Gift Finder <onboarding@resend.dev>}"
      ALLOWED_EMAIL: "${ALLOWED_EMAIL:?ALLOWED_EMAIL is required}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:?GEMINI_API_KEY is required}"
      EBAY_APP_ID: "${EBAY_APP_ID:-}"
    ports:
      - "3000:3000"

volumes:
  db-data:
