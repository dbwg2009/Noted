services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: birthday
      POSTGRES_PASSWORD: birthday
      POSTGRES_DB: birthday
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birthday -d birthday"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/dbwg2009/noted-migrator:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      provenance: false
      sbom: false
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://birthday:birthday@db:5432/birthday"

  app:
    image: ghcr.io/dbwg2009/noted:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      provenance: false
      sbom: false
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://birthday:birthday@db:5432/birthday"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required - generate with openssl rand -base64 32}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      RESEND_API_KEY: "${RESEND_API_KEY:?RESEND_API_KEY is required}"
      EMAIL_FROM: "${EMAIL_FROM:-Noted <onboarding@resend.dev>}"
      ALLOWED_EMAIL: "${ALLOWED_EMAIL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}"
      OPENROUTER_REFERER: "${OPENROUTER_REFERER:-http://localhost:3000}"
      OPENROUTER_APP_NAME: "${OPENROUTER_APP_NAME:-Noted}"
      EBAY_APP_ID: "${EBAY_APP_ID:-}"
      CRON_SECRET: "${CRON_SECRET:?CRON_SECRET is required - generate with openssl rand -hex 32}"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/public/uploads

  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CRON_SECRET: "${CRON_SECRET:?CRON_SECRET is required}"
      CRON_INTERVAL_SECONDS: "${CRON_INTERVAL_SECONDS:-86400}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Wait for the app to come up, then poll the reminders endpoint.
        until curl -fsS http://app:3000/api/auth/providers >/dev/null 2>&1; do
          echo "[cron] waiting for app..."; sleep 5;
        done
        while true; do
          echo "[cron] $(date -u) triggering daily reminders";
          curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders \
            && echo "" || echo "[cron] request failed (will retry next cycle)";
          sleep "$$CRON_INTERVAL_SECONDS";
        done

volumes:
  db-data:
  uploads:
